version: 2

updates:
  # Python dependencies in uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor and patch updates; major updates get their own PRs
      minor-and-patch:
        update-types: [minor, patch]

  # Versions of the actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
